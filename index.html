<title>Dashing Classes App</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&family=Mukta:wght@400;600;700&display=swap">
<style>
/* Layout: sticky navy+gold header with tab chips; one centred column of white cards on a cool ivory ground; navy hero card on Home. Single premium light look. */
:root{
  --navy:#0A1F3D; --navy2:#13315C; --deep:#061429; --gold:#C9A24D; --gold2:#E8D3A0; --goldtext:#8A6A1F;
  --red:#C8102E; --redbg:#FBEFF1; --bg:#F3F4F7; --card:#FFFFFF; --line:#E3E7EE; --line2:#CDD5E1;
  --text:#1B2030; --sec:#5A6478; --green:#17703A; --greenbg:#EAF5EE; --amber:#8A5A00; --amberbg:#FBF3DF; --blue:#1F4E86; --bluebg:#EEF3FA;
  --head:'Poppins','Mukta',system-ui,sans-serif; --body:'Inter','Mukta',system-ui,-apple-system,'Segoe UI',sans-serif;
  --shadow:0 1px 2px rgba(10,31,61,.05),0 10px 28px rgba(10,31,61,.07);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--text);height:100%}
body{font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(180deg,var(--navy2),var(--navy));color:#fff;border-bottom:2px solid var(--gold);box-shadow:0 6px 18px rgba(6,20,41,.25)}
.bar{display:flex;align-items:center;gap:12px;padding-block:12px 10px}
.logo{width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none;box-shadow:0 0 0 2px var(--gold)}
.logo img{width:40px;height:40px;object-fit:contain}
.brand{flex:1;min-width:0}
.brand b{font-family:var(--head);font-size:17px;letter-spacing:.4px;display:block}
.brand span{font-size:12.5px;color:var(--gold2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.iconbtn{background:transparent;border:1px solid rgba(232,211,160,.55);color:var(--gold2);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;cursor:pointer}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:2px 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid rgba(255,255,255,.14);background:transparent;color:#D5DDEA;border-radius:999px;padding:7px 15px;font-weight:600;font-size:13.5px;cursor:pointer}
.tab.on{background:linear-gradient(180deg,#E3C77F,var(--gold));border-color:var(--gold);color:var(--deep)}
main{padding-block:18px 48px;display:grid;gap:14px}
.demo{background:var(--amberbg);color:var(--amber);border:1px solid var(--gold2);border-radius:12px;padding:9px 12px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;min-width:0;box-shadow:var(--shadow)}
.card h2{font-family:var(--head);font-size:17px;margin:0 0 12px;color:var(--navy);text-wrap:balance;display:flex;align-items:center;gap:8px}
.card h2::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--gold);flex:none}
.row h2::before{display:none}
.card h3{font-size:12.5px;margin:14px 0 6px;color:var(--sec);text-transform:uppercase;letter-spacing:.08em}
.hero{background:radial-gradient(120% 140% at 100% 0%,#1C4372 0%,var(--navy) 55%,var(--deep) 100%);border:1px solid #233F66;color:#fff}
.hero h2{color:#fff;font-size:21px}
.hero h2::before{display:none}
.hero .kick{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold2);margin-bottom:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{border-radius:13px;padding:12px 13px;background:var(--bluebg);min-width:0;border:1px solid transparent}
.hero .stat{background:#fff;border-color:rgba(201,162,77,.35)}
.stat small{display:block;color:var(--sec);font-size:12px;font-weight:600;letter-spacing:.02em}
.stat b{font-family:var(--head);font-size:21px;color:var(--navy);display:block;font-variant-numeric:tabular-nums;line-height:1.3}
.stat em{font-style:normal;font-size:12.5px;color:var(--sec)}
.stat.red{background:var(--redbg)} .stat.red b{color:var(--red)}
.stat.green{background:var(--greenbg)} .stat.green b{color:var(--green)}
.stat.amber{background:var(--amberbg)} .stat.amber b{color:var(--amber)}
.hero .stat.red,.hero .stat.green,.hero .stat.amber{background:#fff}
.list{display:grid}
.item{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line);min-width:0;flex-wrap:wrap}
.item:first-child{border-top:none}
.item .main{flex:1;min-width:150px}
.item .main b{display:block;font-weight:600}
.item .main span{display:block;font-size:13px;color:var(--sec)}
.num{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.p-green{background:var(--greenbg);color:var(--green)} .p-red{background:var(--redbg);color:var(--red)}
.p-amber{background:var(--amberbg);color:var(--amber)} .p-blue{background:var(--bluebg);color:var(--blue)} .p-grey{background:#EEF1F5;color:var(--sec)}
.btn{border:none;border-radius:11px;padding:10px 16px;font-weight:600;cursor:pointer;background:var(--navy);color:#fff;font-size:14px}
.btn.red{background:var(--red)}
.btn.gold{background:linear-gradient(180deg,#E3C77F,var(--gold));color:var(--deep);font-weight:700}
.btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line2)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:9px}
.btn.wa{background:#1B9E4B}
a.btn{text-decoration:none;display:inline-block;color:#fff}
.btn:focus-visible,.tab:focus-visible,.lg:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold2);outline-offset:1px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.form .full{grid-column:1/-1}
label.f{display:grid;gap:4px;font-size:12.5px;font-weight:600;color:var(--sec)}
input,select,textarea{width:100%;border:1px solid var(--line2);border-radius:11px;padding:10px 11px;background:#fff;font-size:15px}
textarea{min-height:70px;resize:vertical}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:#fff;border-radius:999px;padding:5px 13px;font-size:13px;font-weight:600;cursor:pointer;color:var(--navy)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.langs{display:inline-flex;background:#EEF1F6;border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.lg{border:none;background:transparent;border-radius:999px;padding:6px 14px;font-weight:600;font-size:13.5px;color:var(--sec);cursor:pointer}
.lg.on{background:var(--navy);color:#fff;box-shadow:0 2px 6px rgba(10,31,61,.2)}
.pa{min-width:44px;border-radius:10px;border:none;font-weight:700;padding:8px 0;cursor:pointer}
.pa.P{background:var(--greenbg);color:var(--green)} .pa.A{background:var(--red);color:#fff}
.mk{width:84px;text-align:center}
.muted{color:var(--sec);font-size:13px}
.note{background:var(--bluebg);border-radius:10px;padding:10px 12px;font-size:13.5px;color:var(--blue)}
.cred{background:var(--amberbg);border:1px dashed var(--gold);border-radius:12px;padding:12px;font-size:15px}
.cred code{font-size:18px;font-weight:700;color:var(--navy);user-select:all}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;z-index:20;max-width:90vw;border:1px solid var(--gold)}
.loginbg{min-height:100%;background:radial-gradient(90% 60% at 50% 0%,#1C4372 0%,var(--navy) 50%,var(--deep) 100%)}
.login{min-height:100%;display:grid;place-items:center;padding-block:28px}
.lbox{width:100%;max-width:410px;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.35);border:1px solid rgba(201,162,77,.5)}
.lhead{background:linear-gradient(180deg,var(--navy2),var(--navy));color:#fff;text-align:center;padding:24px 16px 20px;border-bottom:2px solid var(--gold)}
.logo.big{width:88px;height:88px;margin:0 auto 10px;box-shadow:0 0 0 3px var(--gold),0 0 0 8px rgba(201,162,77,.18)}
.logo.big img{width:76px;height:76px}
.lhead b{font-family:var(--head);font-size:23px;display:block;letter-spacing:.5px}
.lhead span{font-size:13px;color:var(--gold2)}
.lbody{padding:18px;display:grid;gap:12px}
.lbody .langs{justify-self:center}
.err{color:var(--red);font-size:13.5px;font-weight:600;min-height:1em}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12.5px}
.cal div{padding:6px 0;border-radius:8px}
.cal .h{color:var(--sec);font-weight:700}
.cal .P{background:var(--greenbg);color:var(--green);font-weight:700}
.cal .A{background:var(--red);color:#fff;font-weight:700}
.empty{color:var(--sec);font-size:14px;padding:6px 0}
a{color:var(--blue)}
@media (prefers-reduced-motion:no-preference){.card{animation:in .25s ease-out}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}
</style>

/* ===== Backends: same small API for demo (memory) and Firebase ===== */
function memBackend(){
  const store = new Map(), acc = {}; let cur = null, n = 0;
  const nid = () => "d" + (++n).toString(36) + Math.random().toString(36).slice(2,6);
  const depth = p => p.split("/").length;
  const clone = o => JSON.parse(JSON.stringify(o));
  return {
    async get(p){ const d = store.get(p); return d ? {id:p.split("/").pop(), ...clone(d)} : null; },
    async list(c, w){ const out=[]; for (const [p,d] of store) if (p.startsWith(c+"/") && depth(p)===depth(c)+1 && (!w || d[w[0]]===w[1])) out.push({id:p.split("/").pop(), ...clone(d)}); return out; },
    async set(p, data, merge){ store.set(p, merge ? {...(store.get(p)||{}), ...clone(data)} : clone(data)); },
    async add(c, data){ const k = nid(); store.set(c+"/"+k, clone(data)); return k; },
    async del(p){ store.delete(p); },
    async signIn(email, pw){ const a = acc[email]; if (!a || a.pw !== pw) throw new Error("auth"); cur = {uid:a.uid}; return cur; },
    async signOut(){ cur = null; },
    async createLogin(email, pw){ if (acc[email]) throw new Error("exists"); const uid = "u" + nid(); acc[email] = {pw, uid}; return uid; },
    async changePw(pw){ for (const e in acc) if (acc[e].uid === cur.uid) acc[e].pw = pw; },
    onAuth(cb){ cb(null); }
  };
}
async function fbBackend(){
  const B = "https://www.gstatic.com/firebasejs/10.12.2/";
  const A = await import(B+"firebase-app.js"), U = await import(B+"firebase-auth.js"), F = await import(B+"firebase-firestore.js");
  const app = A.initializeApp(CONFIG), auth = U.getAuth(app), db = F.getFirestore(app);
  const secAuth = U.getAuth(A.initializeApp(CONFIG, "secondary"));
  const wrap = s => s.exists() ? {id:s.id, ...s.data()} : null;
  return {
    async get(p){ return wrap(await F.getDoc(F.doc(db, p))); },
    async list(c, w){ const q = w ? F.query(F.collection(db,c), F.where(w[0],"==",w[1])) : F.collection(db,c); return (await F.getDocs(q)).docs.map(d => ({id:d.id, ...d.data()})); },
    async set(p, data, merge){ await F.setDoc(F.doc(db,p), data, merge ? {merge:true} : {}); },
    async add(c, data){ return (await F.addDoc(F.collection(db,c), data)).id; },
    async del(p){ await F.deleteDoc(F.doc(db,p)); },
    async signIn(e, pw){ return (await U.signInWithEmailAndPassword(auth, e, pw)).user; },
    async signOut(){ await U.signOut(auth); },
    async createLogin(e, pw){ const c = await U.createUserWithEmailAndPassword(secAuth, e, pw); const uid = c.user.uid; await U.signOut(secAuth); return uid; },
    async changePw(pw){ await U.updatePassword(auth.currentUser, pw); },
    onAuth(cb){ U.onAuthStateChanged(auth, cb); },
    curEmail(){ return auth.currentUser?.email || null; }
  };
}

/* ===== Fees logic: monthly fee from admission month, due on dueDay each month ===== */
function dueDate(adm, k, day){ const [y,m] = adm.split("-").map(Number); const d = new Date(y, m-1+k, Math.min(day||10, 28)); return ymd(d); }
function feeInfo(s, on = today()){
  const fee = +s.fee || 0, day = +s.dueDay || 10;
  if (!fee || !s.admission) return {fee, bal:0, months:0, next:null, overdueSince:null};
  let months = 0; while (dueDate(s.admission, months, day) <= on) months++;
  const paid = +s.paid || 0, bal = months*fee - paid;
  const paidMonths = Math.floor(paid / fee);
  return { fee, paid, months, bal, next: dueDate(s.admission, paidMonths, day), overdueSince: bal > 0 ? dueDate(s.admission, paidMonths, day) : null,
           paidTill: paidMonths > 0 ? dueDate(s.admission, paidMonths-1, day).slice(0,7) : null };
}

async function createStudentLogin(sid, loginId, pw, suffix=""){
  const email = loginId.toLowerCase().replace(/[^a-z0-9]/g,"") + suffix + "@" + DOMAIN;
  const uid = await DB.createLogin(email, pw);
  await DB.set("users/"+uid, {role:"student", sid});
  await DB.set("logins/"+loginId.toUpperCase(), {email});
  await DB.set("students/"+sid, {uid, loginId:loginId.toUpperCase()}, true);
  return uid;
}
async function saveAttendance(c, date, absent){
  const list = S.students.filter(s => s.cls === c);
  await DB.set(`attendance/${c}_${date}`, {cls:c, date, absent});
  await Promise.all(list.map(s => DB.set(`students/${s.id}/att/${date}`, {s: absent.includes(s.id) ? "A" : "P"})));
}
async function saveHwCheck(hw, done){
  const list = S.students.filter(s => s.cls === hw.cls);
  await DB.set("hwchecks/"+hw.id, {done});
  await Promise.all(list.map(s => DB.set(`students/${s.id}/hw/${hw.id}`, {done: done.includes(s.id)})));
}
async function saveMarks(t, marks){
  await DB.set("testmarks/"+t.id, {marks});
  const got = Object.entries(marks).filter(([,m]) => m !== "" && m != null).map(([sid,m]) => [sid, +m]);
  const sorted = got.map(g => g[1]).sort((a,b) => b-a), top = sorted[0] ?? null;
  await Promise.all(got.map(([sid,m]) => DB.set(`students/${sid}/marks/${t.id}`,
    {name:t.name, date:t.date, max:t.max, marks:m, rank: sorted.indexOf(m)+1, of: got.length, top})));
}
async function addPayment(s, amount, date, mode, note){
  await DB.add(`students/${s.id}/payments`, {amount:+amount, date, mode, note: note||""});
  s.paid = (+s.paid||0) + (+amount);
  await DB.set("students/"+s.id, {paid: s.paid}, true);
}

async function login(id, pw){
  try {
    let email = id;
    if (!id.includes("@")){ const l = await DB.get("logins/"+id.toUpperCase()); if (!l) throw new Error("noid"); email = l.email; }
    const u = await DB.signIn(email, pw);
    await afterLogin(u.uid);
  } catch(e){ console.log(e); renderLogin(e.message==="noid" ? "noid" : "wrong"); }
}
async function afterLogin(uid){
  if (S.loading === uid || S.uid === uid) return; S.loading = uid;
  try { await afterLogin2(uid); } finally { S.loading = null; }
}
async function afterLogin2(uid){
  const u = await DB.get("users/"+uid);
  if (!u){ await DB.signOut(); return renderLogin("noacc"); }
  S.uid = uid; S.role = u.role; S.sid = u.sid || null; S.tab = "home";
  if (S.role === "admin"){ try { const em = DB.curEmail && DB.curEmail(); if (em && !(await DB.get("logins/ADMIN"))) await DB.set("logins/ADMIN", {email:em}); } catch(e){ console.log(e); }
    await loadStudents(); }
  else { S.me = await DB.get("students/"+S.sid); }
  render();
}

    <div class="card"><h2>${t("payHist")}</h2><div class="list">${pays.length ? pays.map(p => `<div class="item"><div class="main"><b>${fmtDL(p.date)}</b><span>${esc(p.mode||"")}${p.note ? " · "+esc(p.note) : ""}</span></div><span class="num">${rs(p.amount)}</span></div>`).join("") : `<div class="empty">${t("noPay")}</div>`}</div></div>`;
};
function calendar(att, ym){
  const [y,m] = ym.split("-").map(Number), first = new Date(y, m-1, 1).getDay(), days = new Date(y, m, 0).getDate();
  const map = Object.fromEntries(att.map(a => [a.id, a.s]));
  const wd = LANG === "hi" ? ["र","सो","मं","बु","गु","शु","श"] : ["S","M","T","W","T","F","S"];
  let h = wd.map(d => `<div class="h">${d}</div>`).join("") + "<div></div>".repeat(first);
  for (let d = 1; d <= days; d++){ const k = `${ym}-${String(d).padStart(2,"0")}`; h += `<div class="${map[k]||""}">${d}</div>`; }
  return `<div class="cal">${h}</div>`;
}
ST.att = async () => {
  const att = await DB.list(`students/${S.me.id}/att`);
  const months = [...new Set(att.map(a => a.id.slice(0,7)))].sort().reverse();
  if (!months.length) return `<div class="card"><h2>${t("attT")}</h2><div class="empty">${t("noAtt")}</div></div>`;
  return months.map(ym => { const a = att.filter(x => x.id.startsWith(ym)), p = a.filter(x => x.s==="P").length;
    return `<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">${monthNameL(ym)}</h2><span class="pill ${p/a.length>=.75?"p-green":"p-red"}">${Math.round(p*100/a.length)}% · ${p}/${a.length}</span></div><p class="muted">${t("legend")}</p>${calendar(a, ym)}</div>`; }).join("");
};
ST.hw = async () => {
  const [hw, hws] = await Promise.all([DB.list("homework", ["cls", S.me.cls]), DB.list(`students/${S.me.id}/hw`)]);
  const st = Object.fromEntries(hws.map(h => [h.id, h.done]));
  hw.sort((a,b) => b.due.localeCompare(a.due));
  return `<div class="card"><h2>${t("hwT")}</h2><div class="list">${hw.length ? hw.map(h => {
    const tag = st[h.id] === true ? `<span class="pill p-green">${t("hwDone")}</span>` : st[h.id] === false ? `<span class="pill p-red">${t("hwNot")}</span>` : h.due < today() ? `<span class="pill p-grey">${t("hwCheck")}</span>` : `<span class="pill p-amber">${t("hwPend")}</span>`;
    return `<div class="item"><div class="main"><b>${esc(h.title)}</b><span>${esc(h.details||"")}</span><span>${t("submitBy", fmtDL(h.due))}${h.link ? ` · <a href="${esc(h.link)}" target="_blank" rel="noopener">${t("pdf")}</a>` : ""}</span></div>${tag}</div>`; }).join("") : `<div class="empty">${t("noHw")}</div>`}</div></div>`;
};
ST.res = async () => {
  const m = (await DB.list(`students/${S.me.id}/marks`)).sort((a,b) => b.date.localeCompare(a.date));
  return `<div class="card"><h2>${t("myRes")}</h2><div class="list">${m.length ? m.map(r => { const pc = Math.round(r.marks*100/r.max);
    return `<div class="item"><div class="main"><b>${esc(r.name)}</b><span>${fmtDL(r.date)} · ${t("topper", r.top, r.max)}</span></div><div style="text-align:right"><div class="num">${r.marks}/${r.max}</div><span class="pill ${pc>=75?"p-green":pc>=50?"p-amber":"p-red"}">${pc}% · ${t("rank", r.rank, r.of)}</span></div></div>`; }).join("") : `<div class="empty">${t("noRes")}</div>`}</div></div>`;
};
ST.notice = async () => {
  const n = (await DB.list("notices")).filter(x => x.cls === "all" || x.cls === S.me.cls).sort((a,b) => b.date.localeCompare(a.date));

};

const greet = s => t("m_hi", s.parent ? t("m_ji", s.parent) : t("m_par"));
const sign = () => t("m_sign");
const A = {};
A.home = async () => {
  const st = S.students, dues = st.map(s => [s, feeInfo(s)]).filter(([,f]) => f.bal > 0).sort((a,b) => b[1].bal - a[1].bal);
  const totalDue = dues.reduce((x,[,f]) => x + f.bal, 0);
  const attToday = await Promise.all(CLASSES.map(c => DB.get(`attendance/${c}_${today()}`)));
  const marked = attToday.filter(Boolean), absentToday = marked.reduce((x,a) => x + a.absent.length, 0);
  return `<div class="card"><h2>${t("todaySum", fmtDL(today()))}</h2><div class="grid2">
    <div class="stat"><small>${t("totStu")}</small><b>${st.length}</b><em>${CLASSES.map(c => st.filter(s=>s.cls===c).length ? thL(c)+": "+st.filter(s=>s.cls===c).length : "").filter(Boolean).join(" · ")}</em></div>
    <div class="stat ${absentToday?"amber":"green"}"><small>${t("attToday")}</small><b>${marked.length ? t("nAbsent", absentToday) : t("notTaken")}</b><em>${t("inBatches", marked.length)}</em></div>
    <div class="stat red"><small>${t("feesDue")}</small><b>${rs(totalDue)}</b><em>${t("nKids", dues.length)}</em></div></div></div>
    <div class="card"><h2>${t("topDues")}</h2><div class="list">${dues.slice(0,6).map(([s,f]) => `<div class="item"><div class="main"><b>${esc(s.name)}</b><span>${clsL(s.cls)} · ${t("dueSinceS", fmtDL(f.overdueSince))}</span></div><span class="num" style="color:var(--red)">${rs(f.bal)}</span><a class="btn wa sm" target="_blank" rel="noopener" href="${wa(s.phone, feeMsg(s,f))}">WhatsApp</a></div>`).join("") || `<div class="empty">${t("allPaid")}</div>`}</div></div>`;
};
const feeMsg = (s,f) => `${greet(s)}\n${t("m_fee", rs(f.bal), s.name, clsL(s.cls), fmtDL(f.overdueSince))}\n${sign()}`;

/* Attendance */
A.att = async () => {
  const c = S.f.attC || "10", d = S.f.attD || today();
  const list = S.students.filter(s => s.cls === c);
  const doc = await DB.get(`attendance/${c}_${d}`);
  S.f.absent = S.f.absentFor === c+d ? S.f.absent : (doc ? [...doc.absent] : []); S.f.absentFor = c+d;
  const all = await DB.list("attendance", ["cls", c]); const ym = d.slice(0,7), mon = all.filter(a => a.date.startsWith(ym));
  const pct = s => mon.length ? Math.round(mon.filter(a => !a.absent.includes(s.id)).length*100/mon.length) : null;
  const absentList = list.filter(s => S.f.absent.includes(s.id));
  return `<div class="card"><h2>${t("takeAtt")}</h2>${classChips(c,"attC")}
    <div class="row" style="margin-top:10px"><label class="f" style="flex:1">${t("date")}<input type="date" id="attD" value="${d}" data-act="attD"></label>
    <span class="pill ${doc?"p-green":"p-amber"}">${doc ? t("saved") : t("notSaved")}</span></div>
    <p class="muted">${t("attHint")}</p>
    <div class="list">${list.map(s => { const a = S.f.absent.includes(s.id), p = pct(s);
      return `<div class="item"><div class="main"><b>${esc(s.name)}</b><span>${t("thisMonth", p===null?"–":p+"%")}</span></div><button class="pa ${a?"A":"P"}" data-act="tog" data-id="${s.id}" aria-label="${esc(s.name)} ${a?"absent":"present"}">${a?"A":"P"}</button></div>`; }).join("") || `<div class="empty">${t("noStuCls")}</div>`}</div>
    ${list.length ? `<div class="row" style="margin-top:12px"><button class="btn gold" data-act="attSave">${t("saveAtt", list.length - S.f.absent.length, S.f.absent.length)}</button></div>` : ""}</div>
    ${doc && absentList.length ? `<div class="card"><h2>${t("tellAbsent")}</h2><div class="list">${absentList.map(s => `<div class="item"><div class="main"><b>${esc(s.name)}</b><span>${esc(s.phone||t("noNum"))}</span></div><a class="btn wa sm" target="_blank" rel="noopener" href="${wa(s.phone, `${greet(s)}\n${t("m_abs", s.name, fmtDL(d))}\n${sign()}`)}">WhatsApp</a></div>`).join("")}</div></div>` : ""}`;
};
HANDLERS.attC = el => { S.f.attC = el.dataset.v; render(); };
HANDLERS.attD = el => { S.f.attD = el.value; render(); };
HANDLERS.tog = el => { const id = el.dataset.id, i = S.f.absent.indexOf(id); i >= 0 ? S.f.absent.splice(i,1) : S.f.absent.push(id); const a = i < 0; el.className = "pa " + (a?"A":"P"); el.textContent = a?"A":"P";
  const n = S.students.filter(s => s.cls === (S.f.attC||"10")).length; const b = document.querySelector('[data-act="attSave"]'); if (b) b.textContent = t("saveAtt", n - S.f.absent.length, S.f.absent.length); };
HANDLERS.attSave = async () => { await saveAttendance(S.f.attC||"10", S.f.attD||today(), [...S.f.absent]); toast(t("attSaved")); render(); };

/* Homework */

HANDLERS.hwAdd = async () => { const c = $("#hc").value; await DB.add("homework", {cls:c, title:$("#ht").value.trim(), details:$("#hx").value.trim(), due:$("#hd").value, link:$("#hl").value.trim(), created:today()}); S.f.hwC = c; toast(t("hwAdded")); render(); };
HANDLERS.hwOpen = el => { S.f.hwOpen = el.dataset.id; render(); };
HANDLERS.hwClose = () => { S.f.hwOpen = null; render(); };

/* Tests */
A.tests = async () => {
  const c = S.f.tC || "10";
  const tests = (await DB.list("tests", ["cls", c])).sort((a,b) => b.date.localeCompare(a.date));
  let ent = "";
  if (S.f.tOpen){ const tt = tests.find(x => x.id === S.f.tOpen);
    if (tt){ const tm = (await DB.get("testmarks/"+tt.id))?.marks || {}; const list = S.students.filter(s => s.cls === c);
      const got = list.filter(s => tm[s.id] !== undefined && tm[s.id] !== "").map(s => [s, +tm[s.id]]).sort((a,b) => b[1]-a[1]);
      const marks = got.map(g => g[1]);
      ent = `<div class="card"><h2>${t("marksT", esc(tt.name), tt.max)}</h2><p class="muted">${t("absentBlank")}</p><form data-act="tSave"><div class="list">${list.map(s => `<div class="item"><div class="main"><b>${esc(s.name)}</b></div><input class="mk" type="number" min="0" max="${tt.max}" step="0.5" id="m_${s.id}" value="${tm[s.id] ?? ""}" aria-label="${esc(s.name)} marks"></div>`).join("")}</div>
        <div class="row" style="margin-top:12px"><button class="btn gold">${t("saveMarks")}</button><button type="button" class="btn ghost" data-act="tClose">${t("close")}</button></div></form>
        ${got.length ? `<h3>${t("rankList")}</h3><div class="list">${got.map(([s,m]) => { const r = marks.indexOf(m)+1;
          return `<div class="item"><span class="pill ${r<=3?"p-amber":"p-grey"}">#${r}</span><div class="main"><b>${esc(s.name)}</b></div><span class="num">${m}/${tt.max}</span><a class="btn wa sm" target="_blank" rel="noopener" href="${wa(s.phone, `${greet(s)}\n${t("m_res", s.name, tt.name, fmtDL(tt.date), m, tt.max, Math.round(m*100/tt.max), r, got.length)}\n${sign()}`)}">${t("result")}</a></div>`; }).join("")}</div>
        <div class="row" style="margin-top:10px"><button class="btn ghost sm" data-act="tTop">${t("copyTop")}</button></div>` : ""}</div>`; } }
  return `<div class="card"><h2>${t("newTest")}</h2><form class="form" data-act="tAdd"><label class="f">${t("clsF")}${classSelect("tc", c)}</label>
      <label class="f">${t("testName")}<input id="tn" placeholder="${t("testPh")}" required></label>
      <label class="f">${t("date")}<input id="td" type="date" value="${today()}" required></label>
      <label class="f">${t("totMarks")}<input id="tx" type="number" min="1" value="40" required></label>
      <div class="full"><button class="btn gold">${t("makeTest")}</button></div></form></div>${ent}
    <div class="card"><h2>${t("tests")}</h2>${classChips(c,"tC")}<div class="list" style="margin-top:8px">${tests.map(x => `<div class="item"><div class="main"><b>${esc(x.name)}</b><span>${fmtDL(x.date)} · ${t("outOf", x.max)}</span></div><button class="btn sm" data-act="tOpen" data-id="${x.id}">${t("marks")}</button></div>`).join("") || `<div class="empty">${t("noTests")}</div>`}</div></div>`;
};
HANDLERS.tC = el => { S.f.tC = el.dataset.v; S.f.tOpen = null; render(); };
HANDLERS.tAdd = async () => { const c = $("#tc").value; const id = await DB.add("tests", {cls:c, name:$("#tn").value.trim(), date:$("#td").value, max:+$("#tx").value}); Object.assign(S.f, {tC:c, tOpen:id}); toast(t("testMade")); render(); };
HANDLERS.tOpen = el => { S.f.tOpen = el.dataset.id; render(); };
HANDLERS.tClose = () => { S.f.tOpen = null; render(); };
HANDLERS.tSave = async () => { const tt = await DB.get("tests/"+S.f.tOpen); const marks = {};
  for (const s of S.students.filter(x => x.cls === tt.cls)){ const v = $("#m_"+s.id).value; if (v !== "") marks[s.id] = Math.min(+v, tt.max); }
  await saveMarks(tt, marks); toast(t("marksSaved")); render(); };
HANDLERS.tTop = async () => { const tt = await DB.get("tests/"+S.f.tOpen), tm = (await DB.get("testmarks/"+tt.id)).marks;
  const got = Object.entries(tm).map(([id,m]) => [S.students.find(s => s.id===id)?.name || id, +m]).sort((a,b) => b[1]-a[1]).slice(0,5);
  copy(t("m_top", tt.name, tt.cls) + "\n" + got.map((g,i) => `${["🥇","🥈","🥉","4.","5."][i]} ${g[0]} – ${g[1]}/${tt.max}`).join("\n") + "\n" + sign()); };

HANDLERS.bulkCopy = () => copy(S.f.bulk.map(c => `${c.name} – ${t("sid")}: ${c.id} – ${t("pw")}: ${c.pw}`).join("\n"));
HANDLERS.bulkGo = async () => {
  const lines = $("#bulk").value.split("\n").map(l => l.trim()).filter(Boolean), btn = $("#bulkBtn");
  if (!lines.length) return; btn.disabled = true;
  const out = [], fails = []; let n = S.students.length;
  for (let i = 0; i < lines.length; i++){
    const [name, c0, parent="", phone="", fee="", adm="", day="", paid="", pdate="", mode=""] = lines[i].split(",").map(x => x.trim());
    btn.textContent = `${i+1} / ${lines.length}…`;
    const cls = normCls(c0);
    if (!name) continue; if (!CLASSES.includes(cls)){ fails.push(`${name}: ${t("badCls")} (${c0||"-"})`); continue; }
    try {
      let id; do { id = "DC" + (101 + n++); } while (await DB.get("logins/"+id));
      const pw = String(Math.floor(100000 + Math.random()*900000)), admission = /^\d{4}-\d{2}-\d{2}$/.test(adm) ? adm : today();
      await DB.set("students/"+id, {name, cls, parent, phone:phone.replace(/\D/g,"").slice(-10), admission, fee:+fee||0, dueDay:Math.min(28, Math.max(1, +day||10)), paid:0, created:today()});
      await createStudentLogin(id, id, pw);
      if (+paid > 0) await addPayment({id, paid:0}, +paid, /^\d{4}-\d{2}-\d{2}$/.test(pdate) ? pdate : today(), mode || "Cash", "");
      out.push({name, id, pw, phone, parent});
    } catch(e){ console.error(e); fails.push(`${name}: ${e.message}`); }
  }
  S.f.bulk = out; S.f.bulkFail = fails; await loadStudents(); render(); window.scrollTo(0,0);
};
const credMsg = c => `${t("m_hi", c.parent ? t("m_ji", c.parent) : t("m_par"))}\n${t("m_cred", c.name, APP_LINK || (DEMO ? "(app link)" : location.origin + location.pathname), c.id, c.pw)}\n${sign()}`;
HANDLERS.sC = el => { S.f.sC = el.dataset.v; render(); };
HANDLERS.sEdit = el => { S.f.edit = el.dataset.id; render(); window.scrollTo(0,0); };
HANDLERS.sCancel = () => { S.f.edit = null; render(); };
HANDLERS.credClose = () => { S.f.cred = null; render(); };
HANDLERS.credCopy = () => copy(credMsg(S.f.cred));
HANDLERS.sSave = async () => {
  const data = {name:$("#sn").value.trim(), cls:$("#scl").value, parent:$("#sp").value.trim(), phone:$("#sph").value.trim(), admission:$("#sa").value, fee:+$("#sf").value, dueDay:+$("#sd").value};
  try {
    if (S.f.edit){ await DB.set("students/"+S.f.edit, data, true); S.f.edit = null; toast(t("savedT")); }
    else { const id = $("#sid").value.trim().toUpperCase(), pw = $("#spw").value;
      if (await DB.get("logins/"+id)) return toast(t("idTaken"));
      await DB.set("students/"+id, {...data, paid:0, created:today()});
      await createStudentLogin(id, id, pw);
      S.f.cred = {name:data.name, id, pw, phone:data.phone, parent:data.parent}; }
    await loadStudents(); render(); window.scrollTo(0,0);
  } catch(e){ console.error(e); toast(t("notSavedE", e.message)); }
};
HANDLERS.sReset = async el => { const s = S.students.find(x => x.id === el.dataset.id); const pw = String(Math.floor(100000+Math.random()*900000));
  try { if (s.uid) await DB.del("users/"+s.uid); await createStudentLogin(s.id, s.loginId || s.id, pw, "r" + Date.now().toString(36).slice(-4));
    S.f.cred = {name:s.name, id:s.loginId || s.id, pw, phone:s.phone, parent:s.parent}; await loadStudents(); render(); window.scrollTo(0,0); } catch(e){ toast(t("failE", e.message)); } };
HANDLERS.sLeft = async el => { if (S.f.confirmLeft !== el.dataset.id){ S.f.confirmLeft = el.dataset.id; el.textContent = t("sureRemove"); return; }
  const s = S.students.find(x => x.id === el.dataset.id); await DB.set("students/"+s.id, {left:true}, true); if (s.uid) await DB.del("users/"+s.uid); toast(t("removed", s.name)); await loadStudents(); render(); };

/* ===== Demo seed (sample data, only in DEMO mode) ===== */
async function seedDemo(){
  const uid = await DB.createLogin("admin@" + DOMAIN, "admin123");
  await DB.set("users/"+uid, {role:"admin"}); await DB.set("logins/ADMIN", {email:"admin@"+DOMAIN});
  const d0 = new Date(), back = k => ymd(new Date(d0.getFullYear(), d0.getMonth(), d0.getDate()-k));
  const mAgo = k => ymd(new Date(d0.getFullYear(), d0.getMonth()-k, 5));
  const ppl = [["Aarav Sharma","10","Sunil Sharma",4],["Priya Verma","10","Rakesh Verma",7],["Rohit Kumar","10","Manoj Kumar",3],["Sneha Gupta","10","Anil Gupta",5],["Vikas Yadav","10","Ramesh Yadav",2],
               ["Ankit Mishra","12","Dinesh Mishra",6],["Neha Singh","12","Ajay Singh",4],["Karan Mehta","12","Vijay Mehta",3],["Pooja Rani","12","Suresh Kumar",5]];
  const fees = {"10":1200, "12":1800};
  for (let i = 0; i < ppl.length; i++){ const [name,c,parent,mo] = ppl[i], id = "DC" + (101+i), fee = fees[c];
    const paid = i % 3 === 1 ? (mo-2)*fee : i % 4 === 2 ? (mo-1)*fee + fee/2 : mo*fee;
    await DB.set("students/"+id, {name, cls:c, parent, phone:"98100000" + String(10+i), admission:mAgo(mo-1), fee, dueDay:10, paid:0, created:mAgo(mo-1)});
    await createStudentLogin(id, id, i === 0 ? "1234" : "123456");
    S.students = (await DB.list("students")).sort(byName);
    let left = paid, k = 0; while (left > 0){ const amt = Math.min(fee, left); await addPayment(S.students.find(s => s.id===id), amt, mAgo(mo-1-k).slice(0,8)+"0"+(3+k%5), k%2 ? "UPI" : "Cash", ""); left -= amt; k++; }
  }
  await loadStudents();
  for (let k = 20; k >= 0; k--){ const d = new Date(d0.getFullYear(), d0.getMonth(), d0.getDate()-k); if (d.getDay() === 0) continue; const ds = ymd(d);
    for (const c of ["10","12"]){ if (k === 0 && c === "12") continue; const ids = S.students.filter(s => s.cls === c).map(s => s.id); const ab = ids.filter((id,j) => (j*7 + k*3) % 11 === 0); await saveAttendance(c, ds, ab); } }
  const hw = [["10","Ex 6.2 Q1–8 (Triangles)","Copy mein saaf likhein",back(4),back(2)],["10","DPP 14 – Trigonometry","Q12 se Q20",back(1),back(-1)],["12","Integrals PYQ set 3","Q1–15",back(3),back(1)],["12","Ex 7.10 Q1–10","",back(0),back(-2)]];
  for (const [c,title,details,created,due] of hw){ const id = await DB.add("homework", {cls:c, title, details, due, link:"", created});
    if (due < today()){ const ids = S.students.filter(s => s.cls===c).map(s => s.id); await saveHwCheck({id, cls:c}, ids.filter((x,j) => j % 4 !== 1)); } }
  const tests = [["10","Ch 1–3 Test",back(12),40,[34,29,38,22,31]],["10","Trigonometry Test",back(3),25,[21,24,15,19,""]],["12","Matrices & Determinants",back(9),40,[30,36,27,33]]];
  for (const [c,name,date,max,ms] of tests){ const id = await DB.add("tests", {cls:c, name, date, max}); const ids = S.students.filter(s => s.cls===c).map(s => s.id).sort(); const marks = {};
    ids.forEach((sid,j) => { if (ms[j] !== "" && ms[j] !== undefined) marks[sid] = ms[j]; }); await saveMarks({id, name, date, max}, marks); }
  await DB.add("notices", {cls:"all", text:"Sunday ko extra doubt class 10 baje se.", link:"", date:back(1)});
  await DB.add("notices", {cls:"10", text:"Trigonometry ki PPT aur DPP – yahan se download karein.", link:"https://example.com/trigonometry-notes", date:back(2)});
  S.students = [];
}
